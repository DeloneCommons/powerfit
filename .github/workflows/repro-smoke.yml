name: repro-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare verification reports
        run: |
          mkdir -p build/reports "$RUNNER_TEMP/powerfit-mpl"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/powerfit-mpl" >> "$GITHUB_ENV"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            environments/requirements-py313.txt
            environments/requirements-lock-py313.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environments/requirements-py313.txt -c environments/requirements-lock-py313.txt
          python -m pip install external_software/pyvoro2-0.6.3-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl
          python -m pip check

      - name: Install PDF build and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cm-super \
            latexmk \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures \
            texlive-publishers \
            texlive-science

      - name: Run focused manuscript and integrity tests
        run: python -m unittest discover -s tests -v 2>&1 | tee build/reports/unit-tests.txt

      - name: Check repository and original frozen scientific artifacts
        run: python scripts/check_repo_consistency.py 2>&1 | tee build/reports/repository-before.txt

      - name: Verify complete frozen results and four inline numerical tables
        run: |
          python scripts/check_rerun_results.py 2>&1 | tee build/reports/result-completeness.txt
          python scripts/check_manuscript_tables.py 2>&1 | tee build/reports/manuscript-tables.txt

      - name: Verify canonical vector figures in temporary directories
        run: python scripts/check_manuscript_figures.py 2>&1 | tee build/reports/figures.txt

      - name: Run smoke subsets for Experiments A and B
        run: |
          {
            python experiments/runners/run_exact_recovery.py \
              --smoke \
              --output-dir .smoke/exact_recovery
            python experiments/analysis/analyze_exact_recovery.py \
              --runs .smoke/exact_recovery/runs.csv \
              --output-dir .smoke/exact_recovery_analysis
            python experiments/runners/run_noise_robustness.py \
              --smoke \
              --output-dir .smoke/noise_robustness
            python experiments/analysis/analyze_noise_robustness.py \
              --runs .smoke/noise_robustness/runs.csv \
              --output-dir .smoke/noise_robustness_analysis
          } 2>&1 | tee build/reports/synthetic-smoke.txt

      - name: Run lightweight J1 smoke audit on showcase data
        run: |
          python scripts/qtaim/analyze_qtaim_dataset_audit.py \
            data/qtaim_showcase/systems.csv \
            --output-dir .smoke/J1_dataset_audit \
            --no-progress \
            --no-plots \
            --require-all 2>&1 | tee build/reports/qtaim-smoke.txt

      - name: Build the canonical PDF and package the arXiv source archive
        run: python scripts/make_arxiv_bundle.py --output build/powerfit-arxiv.zip 2>&1 | tee build/reports/arxiv-package.txt

      - name: Compile the arXiv archive in isolation
        run: |
          bundle_dir=$(mktemp -d "$RUNNER_TEMP/powerfit-arxiv-XXXXXX")
          python -m zipfile -e build/powerfit-arxiv.zip "$bundle_dir"
          mapfile -t sources < <(find "$bundle_dir" -type f -name manuscript.tex)
          if [[ ${#sources[@]} -ne 1 ]]; then
            echo "error: expected exactly one manuscript.tex in the arXiv archive" >&2
            exit 1
          fi
          source_dir=$(dirname -- "${sources[0]}")
          (
            cd "$source_dir"
            latexmk -g -pdf -bibtex -interaction=nonstopmode -halt-on-error manuscript.tex
          ) 2>&1 | tee build/reports/arxiv-build.txt
          cp "$source_dir/manuscript.log" build/reports/arxiv-manuscript.log
          if [[ -f "$source_dir/manuscript.blg" ]]; then
            cp "$source_dir/manuscript.blg" build/reports/arxiv-manuscript.blg
          fi
          python scripts/check_manuscript.py --manuscript-dir "$source_dir" --built \
            2>&1 | tee build/reports/arxiv-validation.txt
          pdffonts "$source_dir/manuscript.pdf" | tee build/reports/arxiv-fonts.txt

      - name: Record PDF font and image inventories
        if: always()
        run: |
          {
            for pdf in manuscript/figures/*.pdf manuscript/manuscript.pdf; do
              [[ -f "$pdf" ]] || continue
              printf '%s\n' "$pdf"
              pdffonts "$pdf"
              pdfimages -list "$pdf"
            done
          } 2>&1 | tee build/reports/pdf-inventories.txt

      - name: Verify scientific artifacts and manuscript sources stayed unchanged
        if: always()
        run: |
          python scripts/check_repo_consistency.py 2>&1 | tee build/reports/repository-after.txt
          git diff --exit-code -- \
            manuscript experiments results data environments external_software \
            scripts/qtaim scripts/_figure_io.py

      - name: Upload manuscript, arXiv source archive, and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerfit-manuscript-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            manuscript/manuscript.pdf
            manuscript/manuscript.log
            manuscript/manuscript.blg
            build/powerfit-arxiv.zip
            build/reports/
            .smoke/
