name: noise_robustness
seed: 20260318
dimensions:
- 2
- 3
n_sites_by_dimension:
  2:
  - 16
  3:
  - 24
replicates: 6
measurement: fraction
weight_scale: 0.08
noise_models:
  gaussian:
    sigmas:
    - 0.005
    - 0.02
  laplace:
    sigmas:
    - 0.005
    - 0.02
  outlier:
    background_sigma: 0.005
    fractions:
    - 0.05
    - 0.10
    amplitudes:
    - 0.05
methods:
- name: squared
  backend: pyvoro2
  mismatch: squared
  solver: analytic
- name: huber
  backend: pyvoro2
  mismatch: huber
  huber_delta: 0.03
  solver: admm
  max_iter: 5000
  rho: 1.0
metrics:
- clean_separator_rmse
- clean_separator_mae
- noisy_separator_rmse
- edge_difference_rmse
- centered_weight_rmse
- algebraic_inconsistency
- edge_weighted_rmse
- objective_total
- realized_any_recall
- runtime_sec
output_dir: results/noise_robustness
